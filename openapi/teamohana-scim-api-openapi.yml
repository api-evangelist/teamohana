openapi: 3.1.0
info:
  title: TeamOhana Public Discovery SCIM API
  description: 'Refer to the [API FAQ](/faq) for more details on the usage.


    Note: API keys for the SCIM API and the Headcount API are different. Please make sure you are using the right keys.'
  version: '1.0'
  termsOfService: https://www.teamohana.com/terms-and-conditions
security:
- Authorization: []
tags:
- name: SCIM
paths:
  /{domain}/ServiceProviderConfig:
    get:
      parameters:
      - name: domain
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      enum:
                      - urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
                      type: string
                  authenticationSchemes:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          enum:
                          - httpdigest
                          - oauth2
                          - httpbasic
                          - oauthbearertoken
                          - oauth
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        specUri:
                          type: string
                        documentationUri:
                          type: string
                      required:
                      - type
                      - name
                      - description
                  sort:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                    - supported
                    title: ohana.common.schemas.scim.service-prodvider/sort
                  changePassword:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                    - supported
                    title: ohana.common.schemas.scim.service-prodvider/changePassword
                  patch:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                    - supported
                    title: ohana.common.schemas.scim.service-prodvider/patch
                  filter:
                    type: object
                    properties:
                      supported:
                        type: boolean
                      maxResults:
                        type: integer
                        format: int64
                    required:
                    - supported
                    - maxResults
                    title: ohana.common.schemas.scim.service-prodvider/filter
                  etag:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                    - supported
                    title: ohana.common.schemas.scim.service-prodvider/etag
                  documentationUri:
                    type: string
                  bulk:
                    type: object
                    properties:
                      supported:
                        type: boolean
                      maxOperations:
                        type: integer
                        format: int64
                      maxPayloadSize:
                        type: integer
                        format: int64
                    required:
                    - supported
                    - maxOperations
                    - maxPayloadSize
                    title: ohana.common.schemas.scim.service-prodvider/bulk
                required:
                - authenticationSchemes
                - bulk
                - changePassword
                - etag
                - filter
                - patch
                - schemas
                - sort
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    enum:
                    - 307
                    - 401
                    - 412
                    - 308
                    - 500
                    - 501
                    - 413
                    - 404
                    - 409
                    - 400
                    - 403
