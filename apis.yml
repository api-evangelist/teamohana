name: TeamOhana
description: 'TeamOhana is an HR-technology company that provides a headcount management
  and planning platform serving as a single source of truth for a company''s people
  budget. It connects Finance, HR, and Talent Acquisition teams around real-time,
  approved headcount so organizations can plan, track, and control hiring against
  budget in one collaborative workflow rather than across disconnected spreadsheets.
  The platform integrates with HRIS, ATS, and financial planning systems (Workday,
  SAP SuccessFactors, Bamboo HR, HiBob, UKG, Personio, Namely, Greenhouse-class ATS,
  and Pigment). Its Public API exposes SCIM 2.0 user provisioning plus Headcount,
  Discovery, and Scenario endpoints for planning and reporting. TeamOhana is backed
  by Sierra Ventures and runs a security program that is SOC 2 and ISO 27001 certified
  (verified via its public trust center).'
